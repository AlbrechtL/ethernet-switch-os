site_name: Ethernet Switch OS
site_description: Documentation for Ethernet Switch OS, a Linux system for managed Ethernet switches configured through OpenConfig and YANG.
site_url: https://albrechtl.github.io/ethernet-switch-os/
repo_url: https://github.com/AlbrechtL/ethernet-switch-os
repo_name: AlbrechtL/ethernet-switch-os
edit_uri: edit/master/docs/

strict: true

# With strict, broken #anchors in links fail the build as well.
validation:
  anchors: warn

# Read by pip in CI, and the template for new feature pages: not pages.
exclude_docs: |
  requirements.txt
  features/_template.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  # The docs used to be split by interface; keep the old links working.
  - redirects:
      redirect_maps:
        getting-started.md: getting-started/index.md
        web-ui.md: getting-started/web-ui.md
        restconf/index.md: getting-started/restconf.md
        cli/basics.md: getting-started/cli.md
        cli/system.md: features/system.md
        cli/ip.md: features/management-ip.md
        cli/interfaces.md: features/ports.md
        cli/vlans.md: features/vlans.md
        cli/spanning-tree.md: features/spanning-tree.md
        snmp/index.md: features/snmp.md
        cli/commands.md: reference/cli-commands.md
        yang-models.md: reference/yang-models.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - First steps: getting-started/index.md
      - Using the web UI: getting-started/web-ui.md
      - Using the CLI: getting-started/cli.md
      - Using RESTCONF: getting-started/restconf.md
  - Installation:
      - Download: installation/download.md
      - Zyxel GS1900-8: installation/zyxel-gs1900-8.md
      - Albrecht RTL8382MI test switch: installation/albrecht-rtl8382mi-test.md
      - Raspberry Pi 4-port switch: installation/raspberry-pi.md
      - QEMU x86-64 switch: installation/qemu-x86-64.md
      - Update: installation/update.md
  - Features:
      - System information: features/system.md
      - Management IP address: features/management-ip.md
      - Ports: features/ports.md
      - VLANs: features/vlans.md
      - Spanning tree: features/spanning-tree.md
      - SNMP: features/snmp.md
      - Password and factory reset: features/administration.md
  - Reference:
      - CLI command reference: reference/cli-commands.md
      - YANG models: reference/yang-models.md
      - Comparison with other firmware: comparison.md
      - Limitations: limitations.md
  - Development:
      - Firmware architecture: development/architecture.md
      - Building the firmware: development/building.md
      - Layers and kas files: development/kas.md
      - Testing and CI: development/testing.md
      - Contributing: development/contributing.md
