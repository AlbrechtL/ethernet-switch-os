name: Build images

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Nothing here changes when a layer does, and a push to meta-rtl83xx-bsp or
  # meta-ethernet-switch-os cannot trigger this workflow. Those repositories
  # parse-check themselves on every push; this is what actually builds their
  # current master into images, once a week.
  schedule:
    - cron: "0 4 * * 1"

# Nothing is pinned here. The layer revisions live in kas/, and the policy is
# branch tips: every run builds the current head of each layer's branch.

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per file in kas/board/.
        board: [zyxel-gs1900-8-a1, albrecht-rtl8382mi-test, qemux86-64-switch,
                rpi-managed-switch-rpi0]
        # kas/opt fragments a board is built with on top of kas/opt/ci.yml.
        # The GS1900-8 also gets its emulator, to boot the image below.
        include:
          - board: zyxel-gs1900-8-a1
            opt: ":kas/opt/rtl838x-qemu.yml"
    # A cold build is a full toolchain, kernel and Rust cross-compile; the
    # 6 hour job limit is the real ceiling.
    timeout-minutes: 350

    env:
      # Outside the workspace, on /mnt -- the ephemeral disk where the runner
      # image has one. kas-container bind-mounts all four into the container.
      KAS_BUILD_DIR: /mnt/yocto/build
      DL_DIR: /mnt/yocto/downloads
      SSTATE_DIR: /mnt/yocto/sstate-cache
      # Keep the hash equivalence database with the sstate it describes, so it
      # is cached with it; inside the build directory it would be lost.
      BB_HASHSERVE_DB_DIR: /mnt/yocto/sstate-cache
      KAS_CONTAINER_IMAGE: ethernet-switch-os/kas:5.5

    steps:
      # Dropping the preinstalled toolchains buys the headroom for a Yocto
      # build; df is printed so a future disk-full failure is easy to read.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      "${AGENT_TOOLSDIRECTORY:-/nonexistent}"
          sudo mkdir -p /mnt/yocto
          sudo chown "$USER:$USER" /mnt/yocto
          df -h / /mnt

      # bitbake isolates tasks (no network outside do_fetch) with unprivileged
      # user namespaces, which Ubuntu 24.04's AppArmor restricts by default:
      # "User namespaces are not usable by BitBake". This is a host setting --
      # the container inherits it.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Everything else the build needs is inside this image, so there is no
      # apt step for host dependencies.
      - name: Build the kas container
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.KAS_CONTAINER_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Downloads and sstate are what make a rerun cheap. GitHub evicts caches
      # least-recently-used past 10 GB per repository, so treat a miss as
      # normal: the build is correct either way, just slower.
      - name: Restore downloads and sstate
        uses: actions/cache@v4
        with:
          path: |
            /mnt/yocto/downloads
            /mnt/yocto/sstate-cache
          key: yocto-${{ matrix.board }}-${{ github.sha }}
          restore-keys: |
            yocto-${{ matrix.board }}-

      - name: Build
        run: ./kas-container build kas/board/${{ matrix.board }}.yml:kas/opt/ci.yml${{ matrix.opt }}

      # The deliverables, exactly the files the board file lists under
      # "artifacts:" (the .swu packages, and boot or disk images, and with them
      # the SBOM, license, YANG and MIB archives), under their stable symlink
      # names. The paths there are relative to the checkout, with the build
      # directory as build/; here it is $KAS_BUILD_DIR. cp -L
      # because they are symlinks into the same directory and upload-artifact
      # would otherwise store dangling links. yq is on the runner image.
      - name: Collect images
        if: success()
        run: |
          set -eu
          mkdir -p artifacts
          yq '.artifacts[]' kas/board/${{ matrix.board }}.yml | while read -r path; do
            cp -L "$KAS_BUILD_DIR/${path#build/}" artifacts/
          done
          ls -l artifacts

      # The emulated switch can be booted right here: boot the disk image,
      # install the .swu into the other A/B slot and check that it comes up
      # and gets confirmed. /dev/kvm exists on the hosted runners, but only
      # the kvm group may open it.
      - name: Boot and update test
        if: success() && matrix.board == 'qemux86-64-switch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ./kas-container --kvm --runtime-args "--network=host" \
            shell kas/board/${{ matrix.board }}.yml:kas/opt/ci.yml -c /work/scripts/x86-64-q35-qemu-test

      # The GS1900-8 image in rtl838x-qemu: boot it and check that RESTCONF
      # lists all eight ports. No KVM, the emulated CPU is a MIPS.
      - name: Boot test in rtl838x-qemu
        if: success() && matrix.board == 'zyxel-gs1900-8-a1'
        run: |
          ./kas-container --runtime-args "--network=host" \
            shell kas/board/${{ matrix.board }}.yml:kas/opt/ci.yml${{ matrix.opt }} -c /work/scripts/mips-rtl838x-qemu-test

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ethernet-switch-os-${{ matrix.board }}
          path: artifacts/
          if-no-files-found: error

      # bitbake's own logs are the only way to tell why a task failed once the
      # runner is gone.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.board }}
          path: |
            /mnt/yocto/build/tmp/log/
            /mnt/yocto/build/tmp/work/*/*/*/temp/log.do_*
            /mnt/yocto/build/qemu/*.log
          if-no-files-found: ignore
          retention-days: 7
