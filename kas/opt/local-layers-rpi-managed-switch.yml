# kas/opt/local-layers.yml for the Raspberry Pi switch boards:
#
#   ./kas-container build kas/board/rpi-managed-switch-rpi0.yml:kas/opt/local-layers-rpi-managed-switch.yml
#
# local-layers.yml itself cannot be used with them. It names
# meta-rtl83xx-bsp, and a repository without url that no other file defines
# falls back to the root of this repository -- which kas would then add as a
# layer. meta-rpi-managed-switch-bsp has no url yet anyway (see
# kas/bsp/rpi-managed-switch.yml), so only the OS layer needs releasing here.
header:
  version: 23

repos:
  meta-ethernet-switch-os:
    url: null
    branch: null
