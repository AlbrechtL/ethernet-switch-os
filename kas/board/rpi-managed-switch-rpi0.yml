# 4-port managed switch HAT (github.com/AlbrechtL/rpi-managed-switch-4-port)
# on a Raspberry Pi Zero, booting from SD card with A/B root filesystems.
# Experimental.
#
#   ./kas-container build kas/board/rpi-managed-switch-rpi0.yml
#
# While working on meta-ethernet-switch-os, append
# kas/opt/local-layers-rpi-managed-switch.yml, not kas/opt/local-layers.yml
# (see there). See zyxel-gs1900-8-a1.yml for why the include order does not
# matter.
header:
  version: 23
  includes:
    - kas/base.yml
    - kas/bsp/rpi-managed-switch.yml
    - kas/os.yml

machine: rpi-managed-switch-rpi0

# The SD card image, and the update for a running switch. There is no factory
# .swu: the first install is writing the .wic to the card.
target:
  - rpi-switch-image
  - ethernet-switch-os-swu-upgrade

# What a build is expected to leave behind. "kas build --update" and CI read
# these; the .wic goes onto the SD card (bmaptool copy), the .swu to SWUpdate.
artifacts:
  sdcard: build/tmp/deploy/images/rpi-managed-switch-rpi0/rpi-switch-image-rpi-managed-switch-rpi0.rootfs.wic.bz2
  sdcard-bmap: build/tmp/deploy/images/rpi-managed-switch-rpi0/rpi-switch-image-rpi-managed-switch-rpi0.rootfs.wic.bmap
  swu-upgrade: build/tmp/deploy/images/rpi-managed-switch-rpi0/ethernet-switch-os-swu-upgrade-rpi-managed-switch-rpi0.swu
