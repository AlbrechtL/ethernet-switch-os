# Emulated 8 port switch on QEMU x86-64, with A/B root filesystems and
# updates through EFI Boot Guard. For trying Ethernet Switch OS and for
# testing updates, VLANs and spanning tree without hardware.
#
#   ./kas-container build kas/board/qemux86-64-switch.yml
#   ./kas-container --kvm --runtime-args "--network=host" \
#       shell kas/board/qemux86-64-switch.yml -c /work/scripts/x86-64-q35-qemu
#
# While working on meta-ethernet-switch-os or meta-qemu-switch-bsp, append
# kas/opt/local-layers-qemu-switch.yml, not kas/opt/local-layers.yml (see
# there). See zyxel-gs1900-8-a1.yml for why the include order does not
# matter.
header:
  version: 23
  includes:
    - kas/base.yml
    - kas/bsp/qemu-switch.yml
    - kas/os.yml

machine: qemux86-64-switch

# The disk image, the update for a running switch, and what scripts/x86-64-q35-qemu
# runs them with: the UEFI firmware and QEMU itself (qemu-helper-native
# gathers qemu-system-native and its libraries into one sysroot, as for
# runqemu). There is no factory .swu: the first install is the .wic.
target:
  - qemu-switch-image
  - ethernet-switch-os-swu-upgrade
  - ovmf
  - qemu-helper-native

local_conf_header:
  qemu-switch: |
    # scripts/x86-64-q35-qemu runs QEMU headless, on the serial console. Without
    # SDL and ALSA qemu-system-native builds a good deal faster.
    PACKAGECONFIG:remove:pn-qemu-system-native = "sdl alsa"

# What a build is expected to leave behind. "kas build --update" and CI read
# these; scripts/x86-64-q35-qemu boots the .wic without changing it, the .swu goes to
# SWUpdate.
artifacts:
  disk: build/tmp/deploy/images/qemux86-64-switch/qemu-switch-image-qemux86-64-switch.rootfs.wic
  disk-bmap: build/tmp/deploy/images/qemux86-64-switch/qemu-switch-image-qemux86-64-switch.rootfs.wic.bmap
  swu-upgrade: build/tmp/deploy/images/qemux86-64-switch/ethernet-switch-os-swu-upgrade-qemux86-64-switch.swu
  # Published with the images: the SPDX SBOM of the root filesystem, the
  # open-source licenses, and the YANG modules and SNMP MIBs the switch
  # serves.
  sbom: build/tmp/deploy/images/qemux86-64-switch/qemu-switch-image-qemux86-64-switch.rootfs.spdx.json
  licenses: build/tmp/deploy/images/qemux86-64-switch/ethernet-switch-os-licenses-qemux86-64-switch.tar.gz
  yang: build/tmp/deploy/images/qemux86-64-switch/ethernet-switch-os-yang-qemux86-64-switch.tar.gz
  mibs: build/tmp/deploy/images/qemux86-64-switch/ethernet-switch-os-mibs-qemux86-64-switch.tar.gz
